openapi: 3.1.0
info:
  title: Matriz API
  version: 0.2.3
  summary: REST contract for the Matriz MVP (release 1 scope).
  description: |
    Contract-first source of truth for the Matriz MVP as scoped in release 1
    (see `docs/implementation-plan.md`, `docs/architecture.md`,
    `docs/database.md` and ADRs in `docs/adr/`). The backend is tested against
    this document and the frontend client is generated from it (ADR-0016).

    Scope: authentication (CSRF, sign-in, sign-out, current user), dashboard,
    projects (create, list/search, read, edit, archive, unarchive), project
    members (list = eligible assignees, add, change role, remove, candidate
    search), tasks (create, list/filter/sort, read, edit, delete), task
    assignees (assign, unassign) and comments (list, add).
    Deferred (not in this contract): status history (FR10), deadlines and
    overdue (FR5 deadline part, FR9), in-app notifications (FR11).

    Conventions:
    - JSON over HTTPS; base path `/api/v1`. Identifiers are UUIDs.
    - Errors use `application/problem+json` (RFC 9457) with a stable `code`
      and generic messages that never contain sensitive data (ADR-0010).
    - Authentication: server-side session referenced by the `matriz_session`
      cookie (ADR-0009). Idle timeout 30 min, absolute lifetime 8 h counted
      from sign-in; sign-in always starts a new session (any previous one is
      deleted) and sign-out deletes it. Any request with a missing, expired
      or invalidated session, or whose user was deactivated, returns `401`
      (`UNAUTHENTICATED`).
    - CSRF: every `POST`, `PATCH`, `PUT` and `DELETE` (including sign-in and
      sign-out) must send the `X-XSRF-TOKEN` header with the value of the
      `XSRF-TOKEN` cookie. `GET /auth/csrf` issues/refreshes that cookie; the
      token is rotated at sign-in and the cookie is cleared at sign-out.
      A missing or invalid token returns `403` (`CSRF_INVALID`).
    - Authorization is enforced server-side for every request. A caller who
      cannot see a project (not a member and not an Administrator) receives
      `404` for the project and everything inside it (tasks, members,
      assignees, comments), so its existence is not disclosed. A member who
      can see the resource but lacks permission for the action receives
      `403` (`FORBIDDEN`). Administrators can see and manage every project.
    - Archived projects are read-only: any write on the project, its members,
      tasks, assignees or comments returns `409` (`PROJECT_ARCHIVED`), except
      `unarchive`.
    - Text inputs are trimmed by the server; length limits apply to the
      trimmed value and whitespace-only values are rejected (`400`).
    - Optimistic concurrency on tasks via `version` (ADR-0005).
    - Lists are paginated with `page` (1-based) and `pageSize`; responses
      include `totalItems` for the whole filtered set.
servers:
  - url: /api/v1
    description: Relative base path. In development the Vite dev server proxies `/api` to the backend on port 8080.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: Session lifecycle and current user.
  - name: Dashboard
    description: Overview of the caller's accessible active projects.
  - name: Projects
    description: Project management (archive instead of delete).
  - name: Members
    description: Project membership; members are the eligible task assignees.
  - name: Tasks
    description: Task management within a project.
  - name: Assignees
    description: Task assignments (multiple assignees per task).
  - name: Comments
    description: Comments on tasks.
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      operationId: getCsrfToken
      summary: Issue or refresh the CSRF token cookie
      description: |
        Sets the `XSRF-TOKEN` cookie (readable by JavaScript). The client sends
        its value in the `X-XSRF-TOKEN` header on state-changing requests.
        Call it before sign-in and after sign-out. Does not require a session.
      security: []
      responses:
        '204':
          description: Token cookie set.
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<token>; Path=/; SameSite=Lax`'
              schema:
                type: string
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with email and password
      description: |
        Validates the credentials and creates a new server-side session (any
        session sent with the request is deleted first, so the session ID
        always changes) and a new `XSRF-TOKEN` cookie. Wrong email, wrong password, inactive or
        temporarily locked accounts all return the same generic `401`
        (`INVALID_CREDENTIALS`). After 5 consecutive failed attempts the
        account is locked for 15 minutes (the counter resets after a
        successful sign-in or when the lock is applied; attempts during the
        lock are not counted). More than 20 attempts per minute from the same
        client IP return `429` (`TOO_MANY_ATTEMPTS`) with `Retry-After`.
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            examples:
              demo:
                value:
                  email: ana@matriz.test
                  password: '<demo password from .env.example>'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: '`matriz_session=<opaque id>; Path=/; HttpOnly; SameSite=Lax` (`Secure` outside local development).'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: Deletes the server-side session and clears the session and `XSRF-TOKEN` cookies. The session ID is invalid afterwards; call `GET /auth/csrf` before signing in again.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: Reads the user from the database on every call; a deactivated user gets `401` and the session is deleted.
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Accessible active projects with task counts
      description: |
        Returns the caller's accessible **active** projects (member projects;
        all projects for Administrators), sorted by name, each with task counts
        per status and % Done computed in SQL over all of its tasks (not only a
        page). `totals` aggregates the counts over all accessible active
        projects. Archived projects are excluded.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Dashboard data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List and search accessible projects
      description: |
        Projects the caller is a member of (all projects for Administrators),
        sorted by name ascending. `search` is a case-insensitive "contains"
        match on the name. Archived projects are excluded unless
        `includeArchived=true`.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Any signed-in user can create a project. The caller becomes its owner
        and a `MANAGER` member (owner and role are inferred by the server, never
        taken from the request). New projects are `ACTIVE`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
            examples:
              basic:
                value:
                  name: Website Redesign
                  description: New public website.
      responses:
        '201':
          description: Project created.
          headers:
            Location:
              description: '`/api/v1/projects/{projectId}`'
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      description: Includes task counts per status and % Done (also for archived projects).
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Edit a project
      description: |
        Partial update of name and/or description. Allowed for Managers of the
        project and Administrators; other members receive `403`. Archived
        projects return `409`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
  /projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: archiveProject
      summary: Archive a project (replaces delete)
      description: |
        Projects are never deleted (ADR-0007). Archiving makes the project and
        everything in it read-only and hides it from the default project list
        and the dashboard; tasks, members, assignments and comments are kept.
        The UI asks for confirmation first. Allowed for Managers of the project
        and Administrators. Idempotent: archiving an archived project returns
        `200` unchanged.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Archived project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/unarchive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: unarchiveProject
      summary: Unarchive a project
      description: |
        Makes an archived project `ACTIVE` again. Allowed for Managers of the
        project and Administrators. Idempotent on active projects.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Active project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      operationId: listProjectMembers
      summary: List project members (eligible assignees)
      description: |
        All members of the project, sorted by name. Any member (and
        Administrators) can list them. The members of a project are exactly the
        users eligible to be assigned to its tasks, so this operation also
        serves the assignee selector.
      responses:
        '200':
          description: The members (not paginated; projects are small teams).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Members]
      operationId: addProjectMember
      summary: Add a member
      description: |
        Managers of the project and Administrators add an active user as
        `MEMBER` (default) or `MANAGER`. Already a member → `409`
        (`ALREADY_MEMBER`); unknown or inactive user → `422`
        (`USER_NOT_ELIGIBLE`).
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberAddRequest'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Members]
      operationId: changeProjectMemberRole
      summary: Change a member's role
      description: |
        Managers of the project and Administrators. The owner cannot be
        demoted (`MEMBER` → `422`, `OWNER_IMMUTABLE`); setting the owner's role
        to `MANAGER` returns `200` unchanged. Unknown member → `404`.
        Archived projects return `409`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRoleUpdateRequest'
      responses:
        '200':
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
    delete:
      tags: [Members]
      operationId: removeProjectMember
      summary: Remove a member
      description: |
        Managers of the project and Administrators. The owner cannot be removed
        (`422`, `OWNER_IMMUTABLE`). In the same transaction, the removed
        user's assignments on tasks of this project are deleted (tasks are
        kept and may become unassigned); their comments are kept.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /projects/{projectId}/member-candidates:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Members]
      operationId: listMemberCandidates
      summary: Search users who can be added as members
      description: |
        Active users who are not yet members of the project, matched
        case-insensitively on name or email, sorted by name, at most 20
        results. Only Managers of the project and Administrators (others
        `403`). A read: also allowed on archived projects.
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        '200':
          description: Matching users.
          content:
            application/json:
              schema:
                type: array
                maxItems: 20
                items:
                  $ref: '#/components/schemas/UserContact'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tasks]
      operationId: listProjectTasks
      summary: List, filter and sort tasks of a project
      description: |
        Any member of the project (and Administrators). Filters combine with
        AND; values inside one multi-value filter combine with OR.
      parameters:
        - name: status
          in: query
          description: Filter by one or more statuses (comma-separated).
          required: false
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/TaskStatus'
          example: [TODO, IN_PROGRESS]
        - name: priority
          in: query
          description: Filter by one or more priorities (comma-separated).
          required: false
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/TaskPriority'
        - name: assigneeId
          in: query
          description: >-
            Only tasks assigned to this user (among possibly others). The
            literal `none` lists tasks with no assignee. A "Me" option in the
            UI is mapped by the client to the signed-in user's id.
          required: false
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: string
                const: none
        - name: sort
          in: query
          description: >-
            Sort field; prefix `-` for descending. Enums use semantic order
            (`LOW < MEDIUM < HIGH`, `TODO < IN_PROGRESS < DONE`). Ties are
            broken by `createdAt` descending, then `id`.
          required: false
          schema:
            type: string
            enum: [createdAt, -createdAt, priority, -priority, status, -status, title, -title]
            default: -createdAt
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task
      description: |
        Managers of the project and Administrators; other members receive
        `403`. Status starts as `TODO`; priority defaults to `MEDIUM`. Zero or
        more assignees may be given; each must be a member of the project
        (`422`, `ASSIGNEE_NOT_ELIGIBLE`). The creator is inferred from the
        session.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
            examples:
              basic:
                value:
                  title: Prepare kickoff presentation
                  description: Slides for the client kickoff meeting.
                  priority: HIGH
                  assigneeIds: [6f1c2a3e-8b7d-4c1a-9e2f-1a2b3c4d5e6f]
      responses:
        '201':
          description: Task created.
          headers:
            Location:
              description: '`/api/v1/tasks/{taskId}`'
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Edit a task (title, description, status, priority)
      description: |
        Partial update. Allowed for Managers of the project, Administrators and
        the task's assignees; other members receive `403`. `version` is
        required: if it differs from the current version the request is
        rejected with `409` (`VERSION_CONFLICT`) and the client must reload
        (exceptional case 3). Any status transition is allowed. A successful
        update increments `version`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
            examples:
              start:
                value:
                  status: IN_PROGRESS
                  version: 3
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task
      description: |
        Permanent delete by Managers of the project or Administrators, after a
        confirmation in the UI (ADR-0014). The task's assignments and comments
        are deleted in the same transaction. Other members receive `403`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Task deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
  /tasks/{taskId}/assignees:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Assignees]
      operationId: assignTask
      summary: Assign a user to a task
      description: |
        Managers of the project and Administrators (assignees cannot change
        assignees). The user must be a member of the task's project (`422`,
        `ASSIGNEE_NOT_ELIGIBLE` — also for unknown users). Assigning the same
        user twice returns `409` (`ALREADY_ASSIGNED`); the database enforces
        uniqueness of (task, user). Does not change the task `version`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssigneeAddRequest'
      responses:
        '201':
          description: Assigned. Returns the updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /tasks/{taskId}/assignees/{userId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Assignees]
      operationId: unassignTask
      summary: Remove an assignment
      description: |
        Managers of the project and Administrators. `404` if the user is not
        assigned to the task.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Assignment removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
  /tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      operationId: listTaskComments
      summary: List comments of a task
      description: Oldest first. Any member of the project and Administrators.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      operationId: addTaskComment
      summary: Add a comment
      description: |
        Any member of the project and Administrators. Author and date are set by
        the server from the session; comments cannot be edited or deleted.
        Archived projects return `409`.
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: Comment added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ProjectArchived'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: matriz_session
      description: >-
        Opaque server-side session identifier (Spring Session JDBC, stored in
        PostgreSQL) set at sign-in in an `HttpOnly`, `SameSite=Lax` cookie
        (`Secure` outside local development). Idle timeout 30 min, absolute
        lifetime 8 h; deleted at sign-out (ADR-0009).
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value of the `XSRF-TOKEN` cookie (see `GET /auth/csrf`).
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    ProjectRole:
      type: string
      enum: [MANAGER, MEMBER]
    UserSummary:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    UserContact:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
    CurrentUser:
      type: object
      required: [id, name, email, isAdmin]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
          description: Platform Administrator (sees and manages all projects).
    SignInRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    TaskCounts:
      type: object
      description: Counts over all tasks of the project(s), not only a page.
      required: [todo, inProgress, done, total]
      properties:
        todo:
          type: integer
          minimum: 0
        inProgress:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    Project:
      type: object
      required: [id, name, description, status, owner, myRole, memberCount, taskCounts, progressPercent, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/ProjectStatus'
        owner:
          $ref: '#/components/schemas/UserSummary'
        myRole:
          description: The caller's role in the project; `null` for an Administrator who is not a member.
          oneOf:
            - $ref: '#/components/schemas/ProjectRole'
            - type: 'null'
        memberCount:
          type: integer
          minimum: 1
        taskCounts:
          $ref: '#/components/schemas/TaskCounts'
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Derived — `floor(100 * done / total)`; `0` when the project has no tasks (exceptional case 4).
          readOnly: true
        archivedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
    Dashboard:
      type: object
      required: [user, totals, projects]
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        totals:
          $ref: '#/components/schemas/TaskCounts'
        projects:
          $ref: '#/components/schemas/ProjectPage'
    ProjectCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\S'
          description: 3–100 characters after trimming; not whitespace-only.
        description:
          type: [string, 'null']
          maxLength: 1000
    ProjectUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          pattern: '\S'
        description:
          type: [string, 'null']
          maxLength: 1000
          description: '`null` or empty clears the description.'
    ProjectMember:
      type: object
      required: [user, role, isOwner, joinedAt, active]
      properties:
        user:
          $ref: '#/components/schemas/UserContact'
        role:
          $ref: '#/components/schemas/ProjectRole'
        isOwner:
          type: boolean
        joinedAt:
          type: string
          format: date-time
        active:
          type: boolean
          description: |
            `false` when the member's account is deactivated: still listed as a
            member, but not eligible as an assignee (`422 ASSIGNEE_NOT_ELIGIBLE`).
    MemberAddRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        role:
          allOf:
            - $ref: '#/components/schemas/ProjectRole'
          default: MEMBER
    MemberRoleUpdateRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
    Task:
      type: object
      required: [id, projectId, title, description, status, priority, assignees, createdBy, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assignees:
          type: array
          description: Zero or more assignees, sorted by name; an empty list is shown as "Unassigned".
          items:
            $ref: '#/components/schemas/UserSummary'
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic concurrency version; starts at 1 and is incremented on
            every task update. Send it back on updates.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
    TaskCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          pattern: '\S'
          description: 3–150 characters after trimming; not whitespace-only.
        description:
          type: [string, 'null']
          maxLength: 2000
        priority:
          allOf:
            - $ref: '#/components/schemas/TaskPriority'
          default: MEDIUM
        assigneeIds:
          type: array
          uniqueItems: true
          maxItems: 50
          default: []
          description: Members of the project to assign (0..N).
          items:
            type: string
            format: uuid
    TaskUpdateRequest:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          pattern: '\S'
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        version:
          type: integer
          minimum: 1
          description: The task version the client last read.
    AssigneeAddRequest:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
    Comment:
      type: object
      required: [id, taskId, author, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/UserSummary'
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    CommentPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
    CommentCreateRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          description: 1–2000 characters after trimming; not whitespace-only.
    Problem:
      type: object
      description: RFC 9457 problem details. Never contains sensitive data.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: Path of the request that produced the problem.
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - TOO_MANY_ATTEMPTS
            - CSRF_INVALID
            - FORBIDDEN
            - NOT_FOUND
            - VERSION_CONFLICT
            - PROJECT_ARCHIVED
            - ALREADY_MEMBER
            - ALREADY_ASSIGNED
            - USER_NOT_ELIGIBLE
            - ASSIGNEE_NOT_ELIGIBLE
            - OWNER_IMMUTABLE
            - INTERNAL_ERROR
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Malformed request or invalid field values (e.g. blank title).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/validation-error
            title: Invalid request
            status: 400
            code: VALIDATION_ERROR
            errors:
              - field: title
                message: Title must have between 3 and 150 characters.
    Unauthorized:
      description: Not authenticated, or the session expired or was invalidated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/unauthenticated
            title: Authentication required
            status: 401
            code: UNAUTHENTICATED
    InvalidCredentials:
      description: Generic sign-in failure (wrong email or password, inactive or locked account).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/invalid-credentials
            title: Invalid email or password
            status: 401
            code: INVALID_CREDENTIALS
    Forbidden:
      description: >-
        Authenticated member without permission for this action
        (`FORBIDDEN`), or missing/invalid CSRF token (`CSRF_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/forbidden
            title: Not allowed
            status: 403
            code: FORBIDDEN
    NotFound:
      description: >-
        Resource not found, or not visible to the caller (returned instead of
        `403` for projects and their contents the caller cannot see).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
    ProjectArchived:
      description: The project is archived and therefore read-only.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/project-archived
            title: Project is archived
            status: 409
            code: PROJECT_ARCHIVED
    Conflict:
      description: >-
        Conflict with the current state: stale task `version`
        (`VERSION_CONFLICT`), duplicate membership (`ALREADY_MEMBER`),
        duplicate assignment (`ALREADY_ASSIGNED`) or archived project
        (`PROJECT_ARCHIVED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/version-conflict
            title: Task was modified
            status: 409
            code: VERSION_CONFLICT
    UnprocessableContent:
      description: >-
        Business rule violation: user not eligible to be a member
        (`USER_NOT_ELIGIBLE`) or assignee (`ASSIGNEE_NOT_ELIGIBLE`), or the
        owner cannot be removed/demoted (`OWNER_IMMUTABLE`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/assignee-not-eligible
            title: User cannot be assigned
            status: 422
            code: ASSIGNEE_NOT_ELIGIBLE
    TooManyRequests:
      description: Too many sign-in attempts from this client; retry later.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/too-many-attempts
            title: Too many attempts
            status: 429
            code: TOO_MANY_ATTEMPTS
