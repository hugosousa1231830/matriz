# Local Matriz stack: PostgreSQL 16, the API and the SPA.
#   docker compose up -d db               database only (backend/frontend run with mvnw/npm)
#   docker compose up -d --build --wait   whole application on http://localhost:5173
# Values come from .env (see .env.example). Data persists in the named volume
# matriz-db-data until `docker compose down -v`.
# Networks: backend-net (db, backend) and frontend-net (backend, frontend), so
# only the API reaches the database. Each service has a healthcheck and starts
# after its dependency is healthy.
services:
  db:
    image: postgres:16.16-alpine
    environment:
      POSTGRES_DB: ${MATRIZ_DB_NAME:?set MATRIZ_DB_NAME in .env}
      POSTGRES_USER: ${MATRIZ_DB_USER:?set MATRIZ_DB_USER in .env}
      POSTGRES_PASSWORD: ${MATRIZ_DB_PASSWORD:?set MATRIZ_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MATRIZ_DB_PORT:-5432}:5432"
    volumes:
      - matriz-db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # API built from backend/Dockerfile; same settings as ./mvnw spring-boot:run
  # (local profile: plain HTTP, cookies without Secure).
  backend:
    build: ./backend
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      MATRIZ_DB_HOST: db
      MATRIZ_DB_PORT: "5432"
      MATRIZ_API_PORT: "8080"
      # Client IP for sign-in rate limiting comes from the frontend proxy,
      # which sets X-Forwarded-For to its peer address (frontend/nginx.conf.template).
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      - "127.0.0.1:${MATRIZ_API_PORT:-8080}:8080"
    networks:
      - backend-net
      - frontend-net
    depends_on:
      db:
        condition: service_healthy
    # GET /actuator/health is public and reports the database status too.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 2s

  # SPA built from frontend/Dockerfile, served by nginx, which proxies /api to
  # the backend.
  frontend:
    build:
      context: ./frontend
      secrets:
        - extra_ca
    ports:
      - "127.0.0.1:${MATRIZ_WEB_PORT:-5173}:80"
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy
    # nginx listens on IPv4 only (frontend/nginx.conf.template), hence 127.0.0.1.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

networks:
  backend-net:
  frontend-net:

volumes:
  matriz-db-data:

# Optional PEM file with an extra CA certificate for the frontend image build, for
# networks behind a TLS-inspecting proxy (MATRIZ_EXTRA_CA_CERT in .env).
secrets:
  extra_ca:
    file: ${MATRIZ_EXTRA_CA_CERT:-/dev/null}
