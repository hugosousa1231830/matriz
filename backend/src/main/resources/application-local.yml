# Local development profile: load the git-ignored .env file from the backend
# directory or the repository root. Environment variables still take precedence.
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

# Local development runs over plain HTTP, so cookies cannot be Secure.
matriz:
  auth:
    secure-cookies: false
