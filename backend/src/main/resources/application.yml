# Matriz backend configuration. Values come from environment variables
# (see ../.env.example); there are no credential defaults in this file.
# The "local" profile (used by ./mvnw spring-boot:run) also reads ../.env.
spring:
  application:
    name: matriz-backend
  datasource:
    url: jdbc:postgresql://${MATRIZ_DB_HOST:localhost}:${MATRIZ_DB_PORT:5432}/${MATRIZ_DB_NAME:matriz}
    username: ${MATRIZ_DB_USER}
    password: ${MATRIZ_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    # Idle timeout of the server-side session; the 8 h absolute lifetime is
    # matriz.auth.absolute-session-timeout. The matriz_session cookie
    # (HttpOnly, SameSite=Lax, Secure) is configured in SecurityConfig.
    timeout: 30m
    jdbc:
      # Session tables are created by Flyway (V2__spring_session.sql).
      initialize-schema: never
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      # Request bodies reject unknown properties (additionalProperties: false in openapi.yaml).
      fail-on-unknown-properties: true

server:
  port: ${MATRIZ_API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Shows component status (e.g. "db": UP) without connection details.
      show-components: always
      show-details: never

matriz:
  auth:
    absolute-session-timeout: 8h
    max-failed-attempts: 5
    lock-duration: 15m
    max-attempts-per-minute: 20
    # Session and CSRF cookies carry the Secure flag except in the local profile (plain HTTP).
    secure-cookies: true
  demo:
    # Demo data is inserted only when enabled AND the users table is empty.
    seed: ${MATRIZ_SEED_DEMO:false}
    password: ${MATRIZ_DEMO_PASSWORD:}
