# Serves the SPA and proxies the API on the same origin (no CORS), like the
# Vite dev server does in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        # Replace, never append: the backend trusts this header for the
        # sign-in rate limit, so the client must not be able to set it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
